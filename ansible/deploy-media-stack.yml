---
# Équivalent Ansible de `make init && make up`. Cible localhost par défaut ; passer
# -e target=mon-hote pour une autre machine (Docker doit déjà y être installé, ce
# playbook ne l'installe pas).
#
# Usage :
#   ansible-galaxy collection install -r requirements.yml
#   cp ../.env.example ../.env && $EDITOR ../.env   # DATA_DIR, CACHE_DIR, DEBRID_API_KEY
#   ansible-playbook deploy-media-stack.yml
#
# Arrêt/suppression : ansible-playbook deploy-media-stack.yml -e media_stack_state=absent

- name: Déployer la stack média via Docker Compose
  hosts: "{{ target | default('localhost') }}"
  connection: "{{ 'local' if (target | default('localhost')) == 'localhost' else 'ssh' }}"
  gather_facts: false

  vars:
    project_dir: "{{ playbook_dir }}/.."
    media_stack_state: present
    env_file: "{{ project_dir }}/.env"

  tasks:
    - name: Vérifier que Docker est disponible
      ansible.builtin.command: docker info
      register: docker_info
      changed_when: false

    - name: Lire .env
      ansible.builtin.command: >-
        python3 -c "import json,re,sys; print(json.dumps({m.group(1): m.group(2)
        for line in open(sys.argv[1])
        for m in [re.match(r'^([A-Za-z_][A-Za-z0-9_]*)=(.*)$', line.strip())] if m}))" "{{ env_file }}"
      register: env_json
      changed_when: false

    - name: Charger les variables de .env
      ansible.builtin.set_fact:
        env_vars: "{{ env_json.stdout | from_json }}"

    - name: Vérifier les variables obligatoires
      ansible.builtin.assert:
        that:
          - (env_vars.DATA_DIR | default('')) is match('^/')
          - (env_vars.DEBRID_API_KEY | default('')) | length > 0
        fail_msg: "DATA_DIR (chemin absolu) et DEBRID_API_KEY doivent être renseignés dans .env"

    - name: Préparer DATA_DIR et CACHE_DIR
      when: media_stack_state == 'present'
      become: true
      block:
        - name: Vérifier /dev/fuse (requis par Decypharr)
          ansible.builtin.stat:
            path: /dev/fuse
          register: fuse_dev
          failed_when: not fuse_dev.stat.exists

        - name: Créer l'arborescence
          ansible.builtin.file:
            path: "{{ item }}"
            state: directory
            owner: "{{ env_vars.PUID | default('1000') }}"
            group: "{{ env_vars.PGID | default('1000') }}"
            mode: "0755"
          loop:
            - "{{ env_vars.DATA_DIR }}/remote"
            - "{{ env_vars.DATA_DIR }}/symlinks"
            - "{{ env_vars.DATA_DIR }}/media/movies"
            - "{{ env_vars.DATA_DIR }}/media/tv"
            - "{{ env_vars.CACHE_DIR | default(project_dir ~ '/data/cache') }}/decypharr"
            - "{{ env_vars.CACHE_DIR | default(project_dir ~ '/data/cache') }}/jellyfin"

        # Voir ARCHITECTURE.md « Le piège du montage » : sans propagation shared, le
        # montage FUSE de Decypharr reste invisible pour Jellyfin et les *arr.
        - name: Bind mount de DATA_DIR sur lui-même (persistant dans fstab)
          ansible.posix.mount:
            path: "{{ env_vars.DATA_DIR }}"
            src: "{{ env_vars.DATA_DIR }}"
            fstype: none
            opts: bind,x-systemd.requires-mounts-for={{ env_vars.DATA_DIR | dirname }}
            state: mounted

        - name: Lire la propagation actuelle
          ansible.builtin.command: findmnt -no PROPAGATION {{ env_vars.DATA_DIR }}
          register: propagation
          changed_when: false

        - name: Passer DATA_DIR en rshared
          ansible.builtin.command: mount --make-rshared {{ env_vars.DATA_DIR }}  # noqa: command-instead-of-module (le module mount ne gère pas la propagation)
          when: "'shared' not in propagation.stdout"
          changed_when: true

        # La propagation n'est pas mémorisée par fstab : cette unité la repose à
        # chaque démarrage, avant Docker.
        - name: Unité systemd qui repose rshared au démarrage
          ansible.builtin.copy:
            dest: /etc/systemd/system/media-stack-rshared.service
            mode: "0644"
            content: |
              [Unit]
              Description=Propagation rshared sur {{ env_vars.DATA_DIR }} (stack média)
              RequiresMountsFor={{ env_vars.DATA_DIR }}
              Before=docker.service

              [Service]
              Type=oneshot
              ExecStart=/usr/bin/mount --make-rshared {{ env_vars.DATA_DIR }}
              RemainAfterExit=yes

              [Install]
              WantedBy=multi-user.target

        - name: Activer l'unité
          ansible.builtin.systemd:
            name: media-stack-rshared.service
            enabled: true
            daemon_reload: true

    - name: Créer la config Decypharr si absente
      ansible.builtin.command: bash {{ project_dir }}/scripts/init-decypharr-config.sh
      args:
        creates: "{{ project_dir }}/config/decypharr/config.json"
      when: media_stack_state == 'present'

    - name: (Dé)déployer la stack
      community.docker.docker_compose_v2:
        project_src: "{{ project_dir }}"
        state: "{{ media_stack_state }}"
        pull: "{{ 'always' if media_stack_state == 'present' else omit }}"

    - name: Étapes suivantes
      ansible.builtin.debug:
        msg: "Stack démarrée. Suite : README.md §2 « Mise en route »."
      when: media_stack_state == 'present'
