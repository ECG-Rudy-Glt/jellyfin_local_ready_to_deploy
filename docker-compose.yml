# Stack média : Jellyfin + Seerr + Radarr/Sonarr/Prowlarr/Bazarr + Decypharr (débrideur).
#
# Un seul répertoire hôte, DATA_DIR, est monté au MÊME chemin (/data) dans tous les
# conteneurs qui touchent aux fichiers. C'est ce qui permet aux liens symboliques créés
# par Decypharr (/data/symlinks → /data/remote/...) de rester valides chez Radarr,
# Sonarr, Bazarr et Jellyfin. Voir ARCHITECTURE.md « Le piège du montage ».
#
#   /data/remote     montage FUSE du débrideur (créé par Decypharr)
#   /data/symlinks   « téléchargements » terminés : des liens vers /data/remote
#   /data/media      bibliothèque finale (movies/, tv/) gérée par Radarr/Sonarr

x-common-env: &common-env
  PUID: ${PUID:-1000}
  PGID: ${PGID:-1000}
  TZ: ${TZ:-Etc/UTC}

services:
  # Monte la bibliothèque du débrideur en FUSE et se fait passer pour qBittorrent
  # auprès de Radarr/Sonarr : un « téléchargement » terminé est un lien symbolique
  # vers le fichier distant, jamais une copie locale.
  decypharr:
    image: cy01/blackhole:${DECYPHARR_TAG:-latest}
    container_name: decypharr
    restart: unless-stopped
    environment:
      <<: *common-env
      # Surchargent config/decypharr/config.json : la clé ne vit que dans .env, jamais
      # dans un fichier de config. Préfixe DECYPHARR_ obligatoire (absent de la doc
      # officielle), et API_KEY n'est lue que si NAME est aussi défini.
      DECYPHARR_DEBRIDS__0__NAME: debrid
      DECYPHARR_DEBRIDS__0__PROVIDER: ${DEBRID_PROVIDER:-alldebrid}
      DECYPHARR_DEBRIDS__0__API_KEY: ${DEBRID_API_KEY:?DEBRID_API_KEY requis, voir .env.example}
    ports:
      - "${DECYPHARR_PORT:-8282}:8282"
    volumes:
      - ./config/decypharr:/app
      - ${CACHE_DIR:-./data/cache}/decypharr:/cache
      # rshared : le montage FUSE créé dans le conteneur doit remonter vers l'hôte,
      # puis redescendre dans les autres conteneurs (qui montent /data en rslave).
      - ${DATA_DIR:?DATA_DIR requis (chemin absolu), voir .env.example}:/data:rshared
    devices:
      - /dev/fuse:/dev/fuse:rwm
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    restart: unless-stopped
    environment: *common-env
    ports:
      - "${RADARR_PORT:-7878}:7878"
    volumes:
      - radarr-config:/config
      - ${DATA_DIR}:/data:rslave
    depends_on:
      - decypharr

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    restart: unless-stopped
    environment: *common-env
    ports:
      - "${SONARR_PORT:-8989}:8989"
    volumes:
      - sonarr-config:/config
      - ${DATA_DIR}:/data:rslave
    depends_on:
      - decypharr

  # Agrège les indexeurs et les pousse automatiquement dans Radarr/Sonarr
  # (Settings → Apps). Aucun indexeur n'est préconfiguré : à toi de choisir.
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    restart: unless-stopped
    environment: *common-env
    ports:
      - "${PROWLARR_PORT:-9696}:9696"
    volumes:
      - prowlarr-config:/config

  # Sous-titres : écrit les .srt à côté des fichiers de /data/media.
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    restart: unless-stopped
    environment: *common-env
    ports:
      - "${BAZARR_PORT:-6767}:6767"
    volumes:
      - bazarr-config:/config
      - ${DATA_DIR}:/data:rslave

  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      TZ: ${TZ:-Etc/UTC}
      JELLYFIN_PublishedServerUrl: ${JELLYFIN_PUBLIC_URL:-http://localhost:8096}
    ports:
      - "${JELLYFIN_PORT:-8096}:8096"
    volumes:
      - jellyfin-config:/config
      - ${CACHE_DIR:-./data/cache}/jellyfin:/cache
      # Lecture seule : Jellyfin n'a aucune raison d'écrire dans la bibliothèque.
      - ${DATA_DIR}:/data:ro,rslave
    # Transcodage matériel Intel/AMD (VAAPI/QSV) : décommente si /dev/dri existe sur
    # l'hôte. Docker refuse de démarrer le service si le périphérique est absent.
    # devices:
    #   - /dev/dri:/dev/dri
    # group_add:
    #   - "${RENDER_GID:-105}"   # getent group render | cut -d: -f3

  # Interface de demande (successeur officiel de Jellyseerr et d'Overseerr).
  # Connexion avec les comptes Jellyfin ; envoie les demandes à Radarr/Sonarr.
  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: seerr
    restart: unless-stopped
    init: true
    environment:
      TZ: ${TZ:-Etc/UTC}
      LOG_LEVEL: info
    ports:
      - "${SEERR_PORT:-5055}:5055"
    volumes:
      - seerr-config:/app/config
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/settings/public || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    security_opt:
      - no-new-privileges
    cap_drop:
      - ALL
    depends_on:
      - jellyfin

  # Optionnel : contourne les protections anti-bot de certains indexeurs.
  # Activé avec `COMPOSE_PROFILES=flaresolverr` dans .env (ou `make up-full`).
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    restart: unless-stopped
    profiles: ["flaresolverr"]
    environment:
      TZ: ${TZ:-Etc/UTC}
      LOG_LEVEL: info

volumes:
  radarr-config:
  sonarr-config:
  prowlarr-config:
  bazarr-config:
  jellyfin-config:
  seerr-config:
