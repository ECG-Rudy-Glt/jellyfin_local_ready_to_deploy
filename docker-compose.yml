services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Etc/UTC}
      JELLYFIN_PublishedServerUrl: http://localhost:${JELLYFIN_PORT:-8096}
    ports:
      - "${JELLYFIN_PORT:-8096}:8096"
    volumes:
      - jellyfin-config:/config
      # Bind mount (pas un volume nommé) : scripts/jellyfin-disk-guard.py a besoin
      # d'un chemin hôte direct pour surveiller/purger le cache de transcodage.
      - ${JELLYFIN_CACHE_DIR:-./data/jellyfin-cache}:/cache
      # Bibliothèque partagée avec Riven (voir "Le piège du montage média" dans
      # ARCHITECTURE.md) — lecture seule : Jellyfin ne doit jamais écrire ici.
      - ${MEDIA_DIR:-./data/media}:/media:ro
    # Optionnel — transcodage matériel Intel/AMD VAAPI (décharge le CPU). Décommente
    # si /dev/dri existe sur l'hôte (`ls /dev/dri`), sinon laisse commenté : Docker
    # refuse de démarrer le service si le device n'existe pas.
    # devices:
    #   - /dev/dri:/dev/dri
    depends_on:
      riven:
        condition: service_healthy

  riven:
    # main = branche RivenVFS (v1.x) — latest est figée sur l'ancienne approche par
    # symlinks (scrapers périmés), voir ARCHITECTURE.md.
    image: spoked/riven:main
    container_name: riven
    restart: unless-stopped
    tty: true
    ports:
      - "${RIVEN_PORT:-8080}:8080"
    # SYS_ADMIN + apparmor:unconfined + /dev/fuse : requis par RivenVFS (montage
    # FUSE de la bibliothèque débrideur). Pas de contournement connu.
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    shm_size: 1024m
    devices:
      - /dev/fuse
    environment:
      # root, pas ${PUID}/${PGID} — testé en conditions réelles : le conteneur
      # échoue au démarrage (PermissionError sur /riven/data/logs) avec un
      # utilisateur non-root, cohérent avec le besoin de SYS_ADMIN/FUSE ci-dessus.
      PUID: "0"
      PGID: "0"
      TZ: ${TZ:-Etc/UTC}
      # Clé API du backend — DOIT être strictement identique à
      # RIVEN_BACKEND_API_KEY (repris ci-dessous par riven-frontend). Sans elle,
      # Riven en génère une aléatoire à chaque redémarrage et le frontend perd
      # la connexion.
      API_KEY: ${RIVEN_BACKEND_API_KEY:?RIVEN_BACKEND_API_KEY requis (openssl rand -hex 16), voir README}
      RIVEN_FORCE_ENV: "true"
      RIVEN_DATABASE_HOST: postgresql+psycopg2://postgres:postgres@riven-db/riven
      # Riven démonte son mount_path avant de le remonter — sur /mount lui-même ça
      # casse la propagation vers l'hôte, d'où le sous-répertoire /mount/vfs.
      RIVEN_FILESYSTEM_MOUNT_PATH: /mount/vfs
      # Cache VFS sur disque (le défaut /dev/shm est plafonné par shm_size ci-dessus).
      RIVEN_FILESYSTEM_CACHE_DIR: /riven/cache
      RIVEN_FILESYSTEM_CACHE_MAX_SIZE_MB: ${RIVEN_CACHE_MAX_SIZE_MB:-8192}
      RIVEN_SCRAPING_TORRENTIO_ENABLED: "true"
      RIVEN_SCRAPING_TORRENTIO_URL: https://torrentio.strem.fun
      RIVEN_SCRAPING_ZILEAN_ENABLED: "true"
      RIVEN_SCRAPING_ZILEAN_URL: http://zilean:8181
      RIVEN_SCRAPING_PROWLARR_ENABLED: "true"
      RIVEN_SCRAPING_PROWLARR_URL: http://prowlarr:9696
      RIVEN_SCRAPING_PROWLARR_API_KEY: ${PROWLARR_API_KEY:-}
      # bucket_limit par défaut (5) ne teste qu'une poignée des streams trouvés —
      # monté à 20 (max autorisé) pour aller chercher plus loin avant d'abandonner.
      RIVEN_SCRAPING_BUCKET_LIMIT: "20"
      # Abandon après 5 cycles de scrape ratés plutôt que de retenter indéfiniment
      # tous les jours (backoff after_2/5/10 par défaut).
      RIVEN_SCRAPING_MAX_FAILED_ATTEMPTS: "5"
      RIVEN_DOWNLOADERS_REAL_DEBRID_ENABLED: ${REALDEBRID_ENABLED:-false}
      RIVEN_DOWNLOADERS_REAL_DEBRID_API_KEY: ${REALDEBRID_API_KEY:-}
      RIVEN_DOWNLOADERS_ALL_DEBRID_ENABLED: ${ALLDEBRID_ENABLED:-true}
      RIVEN_DOWNLOADERS_ALL_DEBRID_API_KEY: ${ALLDEBRID_API_KEY:-}
      # 4K + REMUX autorisés par défaut ; rien sous 720p (résolutions "unknown" exclues).
      RIVEN_RANKING_RESOLUTIONS_R2160P: "true"
      RIVEN_RANKING_RESOLUTIONS_UNKNOWN: "false"
      RIVEN_UPDATERS_JELLYFIN_ENABLED: "true"
      RIVEN_UPDATERS_JELLYFIN_URL: http://jellyfin:8096
      RIVEN_UPDATERS_JELLYFIN_API_KEY: ${JELLYFIN_API_KEY:-}
      RIVEN_CONTENT_OVERSEERR_ENABLED: ${JELLYSEERR_ENABLED:-true}
      RIVEN_CONTENT_OVERSEERR_URL: http://jellyseerr:5055
      RIVEN_CONTENT_OVERSEERR_API_KEY: ${JELLYSEERR_API_KEY:-}
    volumes:
      - riven-data:/riven/data
      # Bind mount (pas un volume nommé) : scripts/riven-cache-cleanup.py a besoin
      # d'un chemin hôte direct.
      - ${RIVEN_CACHE_DIR:-./data/riven-cache}:/riven/cache
      # Voir ARCHITECTURE.md "Le piège du montage média" : rshared est ce qui permet
      # au montage FUSE créé ici de devenir visible côté hôte, donc côté Jellyfin.
      - ${MEDIA_DIR:-./data/media}:/mount:rshared
      # Patches source — corrigent des bugs upstream confirmés, voir patches/README.md.
      - ./patches/alldebrid.py:/riven/src/program/services/downloaders/alldebrid.py:ro
      - ./patches/media_info.py:/riven/src/schemas/overseerr/models/media_info.py:ro
      - ./patches/overseerr_api.py:/riven/src/program/apis/overseerr_api.py:ro
      - ./patches/event_manager.py:/riven/src/program/managers/event_manager.py:ro
    healthcheck:
      test: curl -s http://localhost:8080 >/dev/null || exit 1
      interval: 30s
      timeout: 10s
      retries: 10
    depends_on:
      riven-db:
        condition: service_healthy

  riven-frontend:
    image: spoked/riven-frontend:main
    container_name: riven-frontend
    restart: unless-stopped
    tty: true
    environment:
      TZ: ${TZ:-Etc/UTC}
      ORIGIN: http://localhost:${RIVEN_FRONTEND_PORT:-3000}
      BACKEND_URL: http://riven:8080
      BACKEND_API_KEY: ${RIVEN_BACKEND_API_KEY:?RIVEN_BACKEND_API_KEY requis (openssl rand -hex 16), voir README}
      AUTH_SECRET: ${RIVEN_AUTH_SECRET:?RIVEN_AUTH_SECRET requis (openssl rand -base64 32), voir README}
      DATABASE_URL: /riven/data/riven.db
    ports:
      - "${RIVEN_FRONTEND_PORT:-3000}:3000"
    volumes:
      - riven-frontend-data:/riven/data
    depends_on:
      riven:
        condition: service_started

  riven-db:
    image: postgres:17-alpine
    container_name: riven-db
    restart: unless-stopped
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: riven
    volumes:
      - riven-db-data:/var/lib/postgresql/data/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Indexe les hashlists DMM (bibliothèques débrideur partagées) — deuxième vivier
  # de sources en plus de Torrentio/Prowlarr. Premier import long (plusieurs heures),
  # résultats vides pour Riven en attendant. Utilise sa propre base "zilean" dans
  # riven-db, qu'il crée lui-même au premier démarrage (confirmé en test) — voir
  # scripts/init-zilean-db.sh / ansible/deploy-media-stack.yml pour le filet de
  # sécurité si jamais une version différente de l'image ne le fait pas.
  zilean:
    image: ipromknight/zilean:latest
    container_name: zilean
    restart: unless-stopped
    # Le scraper Zilean tourne en continu (indexation DMM permanente, pas ponctuelle)
    # — sans limite il peut occuper 1-2 coeurs en continu. Ajuste selon ta machine.
    cpus: "${ZILEAN_CPU_LIMIT:-2.0}"
    environment:
      TZ: ${TZ:-Etc/UTC}
      Zilean__Database__ConnectionString: "Host=riven-db;Port=5432;Database=zilean;Username=postgres;Password=postgres"
    volumes:
      - zilean-data:/app/data
    healthcheck:
      test: curl -s http://localhost:8181/healthchecks/ping >/dev/null || exit 1
      interval: 30s
      timeout: 10s
      retries: 10
    depends_on:
      riven-db:
        condition: service_healthy

  # Agrégateur d'indexeurs torrent (indexeurs publics — aucun compte requis pour
  # démarrer). UI admin : http://localhost:9696 — clé API à copier dans .env
  # (PROWLARR_API_KEY) après le premier démarrage, voir README.
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    restart: unless-stopped
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Etc/UTC}
    ports:
      - "${PROWLARR_PORT:-9696}:9696"
    volumes:
      - prowlarr-config:/config

  # Interface de demande type Netflix (catalogue TMDB, login délégué à Jellyfin) —
  # ce que la famille/les utilisateurs voient pour demander un film/série. Parle à
  # Riven via l'API compatible Overseerr (RIVEN_CONTENT_OVERSEERR_* ci-dessus).
  jellyseerr:
    image: fallenbagel/jellyseerr:latest
    container_name: jellyseerr
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Etc/UTC}
      LOG_LEVEL: info
    ports:
      - "${JELLYSEERR_PORT:-5055}:5055"
    volumes:
      - jellyseerr-config:/app/config
    depends_on:
      jellyfin:
        condition: service_started

volumes:
  jellyfin-config:
  riven-data:
  riven-frontend-data:
  riven-db-data:
  zilean-data:
  prowlarr-config:
  jellyseerr-config:
